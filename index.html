<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe6" />
    <title>证照间 · 本地智能换底色</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3efe6;
        --paper-deep: #e8e1d3;
        --ink: #162438;
        --muted: #68717c;
        --blue: #1758c9;
        --red: #d94a38;
        --line: rgba(22, 36, 56, 0.18);
        --shadow: 0 24px 60px rgba(31, 39, 54, 0.14);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background:
          linear-gradient(rgba(22, 36, 56, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 36, 56, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 24px 24px;
      }

      button, input, select { font: inherit; }
      button { color: inherit; }

      .shell {
        width: min(1240px, calc(100% - 40px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 2px solid var(--ink);
        border-radius: 50%;
        font-family: "Songti SC", "STSong", serif;
        font-size: 24px;
        font-weight: 700;
        transform: rotate(-7deg);
      }

      .brand strong {
        display: block;
        font-family: "Songti SC", "STSong", serif;
        font-size: 24px;
        letter-spacing: .16em;
      }

      .brand small {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: .24em;
      }

      .privacy {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, .5);
        font-size: 12px;
      }

      .privacy::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2c9a5b;
        box-shadow: 0 0 0 4px rgba(44, 154, 91, .12);
        content: "";
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(320px, .75fr);
        min-height: 680px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(249, 247, 241, .82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .studio {
        position: relative;
        display: grid;
        min-height: 680px;
        place-items: center;
        overflow: hidden;
        padding: 68px 56px;
        border-right: 1px solid var(--line);
        background:
          radial-gradient(circle at 16% 18%, rgba(23, 88, 201, .11), transparent 31%),
          linear-gradient(145deg, rgba(255,255,255,.7), rgba(232,225,211,.5));
      }

      .studio::before {
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(22, 36, 56, .11);
        pointer-events: none;
        content: "";
      }

      .corner-label {
        position: absolute;
        top: 29px;
        left: 35px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: .18em;
      }

      .corner-label::before {
        width: 30px;
        height: 1px;
        background: var(--ink);
        content: "";
      }

      .photo-stage {
        position: relative;
        width: min(360px, 76%);
        aspect-ratio: 295 / 413;
        filter: drop-shadow(0 28px 28px rgba(22, 36, 56, .20));
      }

      .photo-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 10px solid #fff;
        background-color: #d7e5ef;
        background-image:
          linear-gradient(45deg, rgba(255,255,255,.55) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(255,255,255,.55) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(255,255,255,.55) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.55) 75%);
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
      }

      #preview {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 32px;
        text-align: center;
      }

      .empty-state svg {
        width: 72px;
        margin: 0 auto 22px;
        color: var(--blue);
      }

      .empty-state strong {
        font-family: "Songti SC", "STSong", serif;
        font-size: 25px;
        letter-spacing: .08em;
      }

      .empty-state span {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }

      .measurement {
        position: absolute;
        right: -52px;
        bottom: 12px;
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 10px;
        letter-spacing: .05em;
        writing-mode: vertical-rl;
      }

      .stamp {
        position: absolute;
        right: 38px;
        bottom: 32px;
        width: 86px;
        padding: 9px 6px 7px;
        border: 2px solid var(--red);
        color: var(--red);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .14em;
        text-align: center;
        transform: rotate(6deg);
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 42px 38px 32px;
      }

      .eyebrow {
        margin: 0 0 9px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .2em;
      }

      h1 {
        margin: 0;
        font-family: "Songti SC", "STSong", serif;
        font-size: clamp(32px, 3.2vw, 48px);
        font-weight: 700;
        letter-spacing: -.04em;
        line-height: 1.08;
      }

      .intro {
        margin: 14px 0 28px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.75;
      }

      .upload {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        width: 100%;
        padding: 16px 17px;
        border: 1px dashed rgba(22, 36, 56, .45);
        border-radius: 4px;
        background: rgba(255,255,255,.52);
        cursor: pointer;
        transition: border-color .2s, background .2s, transform .2s;
      }

      .upload:hover, .upload.dragging {
        border-color: var(--blue);
        background: rgba(23, 88, 201, .06);
        transform: translateY(-1px);
      }

      .upload-copy { text-align: left; }
      .upload-copy strong { display: block; font-size: 14px; }
      .upload-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }

      .upload-icon {
        display: grid;
        flex: 0 0 38px;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-size: 20px;
      }

      #fileInput { position: absolute; width: 1px; height: 1px; opacity: 0; }

      .controls {
        display: grid;
        gap: 24px;
        margin-top: 28px;
      }

      .field { display: grid; gap: 10px; }

      .field-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }

      .field label, .field-title { font-size: 12px; font-weight: 700; }
      .field-output { color: var(--muted); font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 10px; }

      select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 3px;
        outline: none;
        background: rgba(255,255,255,.6);
      }

      select:focus, input:focus-visible, button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      .swatches { display: flex; flex-wrap: wrap; gap: 11px; }

      .swatch {
        position: relative;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 2px solid #fff;
        border-radius: 50%;
        background: var(--swatch);
        box-shadow: 0 0 0 1px var(--line);
        cursor: pointer;
        transition: transform .18s, box-shadow .18s;
      }

      .swatch:hover { transform: scale(1.08); }
      .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
      .swatch[aria-pressed="true"]::after {
        position: absolute;
        inset: 50% auto auto 50%;
        color: var(--check, #fff);
        content: "✓";
        font-size: 15px;
        font-weight: 700;
        transform: translate(-50%, -52%);
      }

      .custom-color {
        position: relative;
        width: 34px;
        height: 34px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
      }

      .custom-color input {
        position: absolute;
        inset: -10px;
        width: 54px;
        height: 54px;
        opacity: 0;
        cursor: pointer;
      }

      input[type="range"] {
        width: 100%;
        height: 3px;
        accent-color: var(--blue);
        cursor: pointer;
      }

      .retouch {
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .retouch summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        cursor: pointer;
        list-style: none;
        font-size: 12px;
      }

      .retouch summary::-webkit-details-marker { display: none; }
      .retouch summary span { color: var(--muted); font-size: 10px; font-weight: 400; }
      .retouch summary::after { color: var(--blue); content: "+"; font-size: 18px; line-height: 1; }
      .retouch[open] summary::after { content: "−"; }
      .retouch[open] summary { margin-bottom: 18px; }
      .retouch-controls { display: grid; gap: 16px; }

      .status {
        min-height: 42px;
        margin-top: auto;
        padding-top: 28px;
      }

      .status-line {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 11px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--blue);
      }

      .status.busy .status-dot { animation: pulse 1.1s ease-in-out infinite; }
      .status.error .status-dot { background: var(--red); }

      .progress {
        height: 2px;
        margin-top: 10px;
        overflow: hidden;
        background: var(--line);
      }

      .progress span {
        display: block;
        width: 0;
        height: 100%;
        background: var(--blue);
        transition: width .25s ease;
      }

      .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 18px; }

      .download, .reset {
        min-height: 46px;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
        transition: transform .18s, opacity .18s, background .18s;
      }

      .download { background: var(--ink); color: #fff; font-weight: 700; letter-spacing: .08em; }
      .download:hover:not(:disabled) { background: var(--blue); transform: translateY(-1px); }
      .download:disabled { cursor: not-allowed; opacity: .35; }
      .reset { padding: 0 15px; background: transparent; color: var(--muted); }
      .reset:hover { background: var(--paper-deep); color: var(--ink); }

      @keyframes pulse {
        50% { transform: scale(1.8); opacity: .35; }
      }

      @media (max-width: 820px) {
        .shell { width: min(100% - 24px, 620px); padding-top: 18px; }
        header { margin-bottom: 18px; }
        .privacy span { display: none; }
        main { grid-template-columns: 1fr; }
        .studio { min-height: 500px; padding: 58px 42px; border-right: 0; border-bottom: 1px solid var(--line); }
        .photo-stage { width: min(280px, 68vw); }
        .panel { min-height: 650px; padding: 34px 26px 28px; }
      }

      @media (max-width: 440px) {
        .shell { width: calc(100% - 16px); }
        .brand strong { font-size: 20px; }
        .studio { min-height: 430px; }
        .stamp { display: none; }
        .panel { padding-inline: 20px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand" aria-label="证照间">
          <span class="brand-mark">证</span>
          <span><strong>证照间</strong><small>LOCAL PHOTO STUDIO</small></span>
        </div>
        <div class="privacy"><span>照片仅在此设备处理</span></div>
      </header>

      <main>
        <section class="studio" aria-label="证件照预览">
          <div class="corner-label">OUTPUT PREVIEW</div>
          <div class="photo-stage">
            <div class="photo-frame" id="dropZone">
              <canvas id="preview" aria-label="处理后的证件照"></canvas>
              <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
                  <rect x="10" y="7" width="44" height="50" rx="2" stroke="currentColor" stroke-width="2"/>
                  <circle cx="32" cy="25" r="8" stroke="currentColor" stroke-width="2"/>
                  <path d="M18 48c2.5-8 7.2-12 14-12s11.5 4 14 12" stroke="currentColor" stroke-width="2"/>
                </svg>
                <strong>等待照片</strong>
                <span>上传正面半身照<br />智能抠图后即可换底色</span>
              </div>
            </div>
            <span class="measurement" id="measurement">295 × 413 PX · 300 DPI</span>
          </div>
          <div class="stamp" id="engineStamp">WEBGPU<br />READY</div>
        </section>

        <section class="panel">
          <p class="eyebrow">AI ID PHOTO MAKER</p>
          <h1>一张好照片，<br />换个正式背景。</h1>
          <p class="intro">自动识别人像并移除原背景。选择规格与底色，微调构图后直接下载标准证件照。</p>

          <label class="upload" for="fileInput" id="uploadLabel">
            <span class="upload-copy"><strong>上传人像照片</strong><span>JPG / PNG / WEBP，最大 20 MB</span></span>
            <span class="upload-icon" aria-hidden="true">↑</span>
          </label>
          <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" />

          <div class="controls">
            <div class="field">
              <div class="field-head"><label for="sizeSelect">照片规格</label><output class="field-output" id="sizeOutput">295 × 413 px</output></div>
              <select id="sizeSelect">
                <option value="295,413">一寸 · 25 × 35 mm</option>
                <option value="413,579">二寸 · 35 × 49 mm</option>
                <option value="390,567">护照 · 33 × 48 mm</option>
                <option value="358,441">社保照 · 26 × 32 mm</option>
              </select>
            </div>

            <div class="field">
              <span class="field-title" id="backgroundLabel">背景颜色</span>
              <div class="swatches" role="group" aria-labelledby="backgroundLabel">
                <button class="swatch" style="--swatch:#ffffff;--check:#162438" data-color="#ffffff" aria-label="白色背景" aria-pressed="false"></button>
                <button class="swatch" style="--swatch:#438edb" data-color="#438edb" aria-label="蓝色背景" aria-pressed="true"></button>
                <button class="swatch" style="--swatch:#d84b4b" data-color="#d84b4b" aria-label="红色背景" aria-pressed="false"></button>
                <button class="swatch" style="--swatch:#d9dde2;--check:#162438" data-color="#d9dde2" aria-label="浅灰背景" aria-pressed="false"></button>
                <label class="custom-color" aria-label="自定义背景颜色"><input id="colorInput" type="color" value="#438edb" /></label>
              </div>
            </div>

            <div class="field">
              <div class="field-head"><label for="zoomInput">人物大小</label><output class="field-output" id="zoomOutput">100%</output></div>
              <input id="zoomInput" type="range" min="50" max="150" value="100" step="1" />
            </div>

            <div class="field">
              <div class="field-head"><label for="positionInput">上下位置</label><output class="field-output" id="positionOutput">居中</output></div>
              <input id="positionInput" type="range" min="-50" max="50" value="0" step="1" />
            </div>

            <div class="field">
              <div class="field-head"><label for="horizontalInput">左右位置</label><output class="field-output" id="horizontalOutput">居中</output></div>
              <input id="horizontalInput" type="range" min="-50" max="50" value="0" step="1" />
            </div>

            <details class="retouch" open>
              <summary><strong>修图</strong><span>亮度 · 对比度 · 饱和度</span></summary>
              <div class="retouch-controls">
                <div class="field">
                  <div class="field-head"><label for="brightnessInput">亮度</label><output class="field-output" id="brightnessOutput">0%</output></div>
                  <input id="brightnessInput" type="range" min="-50" max="50" value="0" step="1" />
                </div>
                <div class="field">
                  <div class="field-head"><label for="contrastInput">对比度</label><output class="field-output" id="contrastOutput">0%</output></div>
                  <input id="contrastInput" type="range" min="-50" max="50" value="0" step="1" />
                </div>
                <div class="field">
                  <div class="field-head"><label for="saturationInput">饱和度</label><output class="field-output" id="saturationOutput">0%</output></div>
                  <input id="saturationInput" type="range" min="-50" max="50" value="0" step="1" />
                </div>
              </div>
            </details>
          </div>

          <div class="status" id="status" role="status" aria-live="polite">
            <div class="status-line"><span class="status-dot"></span><span id="statusText">等待上传照片</span></div>
            <div class="progress"><span id="progressBar"></span></div>
          </div>

          <div class="actions">
            <button class="download" id="downloadButton" disabled>下载证件照 · JPG</button>
            <button class="reset" id="resetButton" type="button">重置</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module">
      import { env, AutoModel, AutoProcessor, RawImage } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

      const $ = (selector) => document.querySelector(selector);
      const preview = $("#preview");
      const context = preview.getContext("2d");
      const fileInput = $("#fileInput");
      const dropZone = $("#dropZone");
      const uploadLabel = $("#uploadLabel");
      const sizeSelect = $("#sizeSelect");
      const zoomInput = $("#zoomInput");
      const positionInput = $("#positionInput");
      const horizontalInput = $("#horizontalInput");
      const adjustments = ["brightness", "contrast", "saturation"].map((name) => ({
        input: $(`#${name}Input`),
        output: $(`#${name}Output`),
      }));
      const status = $("#status");
      const statusText = $("#statusText");
      const progressBar = $("#progressBar");
      const downloadButton = $("#downloadButton");

      let model;
      let processor;
      let sourceCanvas;
      let cutoutCanvas;
      let sourceUrl;
      let background = "#438edb";
      let processing = false;
      const webGpuAvailable = navigator.gpu
        ? navigator.gpu.requestAdapter().then(Boolean).catch(() => false)
        : Promise.resolve(false);

      env.backends.onnx.wasm.proxy = false;

      const setStatus = (message, type = "", progress = 0) => {
        status.className = `status ${type}`;
        statusText.textContent = message;
        progressBar.style.width = `${progress}%`;
      };

      const coverRect = (sourceWidth, sourceHeight, targetWidth, targetHeight, zoom, shiftX, shiftY) => {
        const scale = Math.max(targetWidth / sourceWidth, targetHeight / sourceHeight) * zoom;
        const width = sourceWidth * scale;
        const height = sourceHeight * scale;
        return { x: (targetWidth - width) / 2 + targetWidth * shiftX, y: (targetHeight - height) / 2 + targetHeight * shiftY, width, height };
      };

      const unmixChannel = (color, backdrop, alpha) => Math.max(0, Math.min(255, (color - backdrop * (1 - alpha)) / alpha));
      const suppressSpill = (spill, otherA, otherB) => Math.min(spill, Math.max(otherA, otherB) + 6);

      console.assert(coverRect(100, 200, 295, 413, 1, 0, 0).width >= 295, "coverRect must cover the output");
      console.assert(coverRect(100, 200, 295, 413, 1, .5, 0).x === 147.5, "horizontal position must move up to 50%");
      console.assert(Math.round(unmixChannel(125, 200, .5)) === 50, "edge color must be separated from its old backdrop");
      console.assert(suppressSpill(120, 30, 40) === 46, "background spill must be suppressed");

      const render = () => {
        const [width, height] = sizeSelect.value.split(",").map(Number);
        preview.width = width;
        preview.height = height;
        context.fillStyle = background;
        context.fillRect(0, 0, width, height);

        const image = cutoutCanvas || sourceCanvas;
        if (image) {
          const rect = coverRect(
            image.width,
            image.height,
            width,
            height,
            Number(zoomInput.value) / 100,
            Number(horizontalInput.value) / 100,
            Number(positionInput.value) / 100,
          );
          const [brightness, contrast, saturation] = adjustments.map(({ input }) => 100 + Number(input.value));
          context.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%)`;
          context.drawImage(image, rect.x, rect.y, rect.width, rect.height);
          context.filter = "none";
        }

        $("#sizeOutput").textContent = `${width} × ${height} px`;
        $("#measurement").textContent = `${width} × ${height} PX · 300 DPI`;
      };

      const loadBrowserImage = (url) => new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = url;
      });

      const ensureModel = async () => {
        if (model && processor) return;
        const progress_callback = (event) => {
          if (event.status === "progress" && Number.isFinite(event.progress)) {
            setStatus(`首次使用，正在下载模型 · ${Math.round(event.progress)}%`, "busy", Math.max(4, event.progress));
          }
        };

        if (await webGpuAvailable) {
          try {
            setStatus("正在加载本地 AI 模型 · WEBGPU", "busy", 4);
            model = await AutoModel.from_pretrained("Xenova/modnet", { device: "webgpu", progress_callback });
            $("#engineStamp").innerHTML = "WEBGPU<br>ACTIVE";
          } catch {
            console.info("WebGPU model initialization failed; using WASM.");
          }
        }

        if (!model) {
          setStatus("WebGPU 不可用，正在切换 WASM", "busy", 8);
          model = await AutoModel.from_pretrained("Xenova/modnet", { device: "wasm", progress_callback });
          $("#engineStamp").innerHTML = "WASM<br>ACTIVE";
        }
        processor = await AutoProcessor.from_pretrained("Xenova/modnet", { progress_callback });
      };

      const processFile = async (file) => {
        if (processing) return;
        if (!file.type.startsWith("image/") || file.size > 20 * 1024 * 1024) {
          setStatus("请选择 20 MB 以内的 JPG、PNG 或 WEBP 图片", "error");
          return;
        }

        processing = true;
        downloadButton.disabled = true;
        cutoutCanvas = undefined;
        if (sourceUrl) URL.revokeObjectURL(sourceUrl);
        sourceUrl = URL.createObjectURL(file);

        try {
          const browserImage = await loadBrowserImage(sourceUrl);
          sourceCanvas = document.createElement("canvas");
          sourceCanvas.width = browserImage.naturalWidth;
          sourceCanvas.height = browserImage.naturalHeight;
          sourceCanvas.getContext("2d").drawImage(browserImage, 0, 0);
          $("#emptyState").hidden = true;
          preview.style.display = "block";
          render();

          await ensureModel();
          setStatus("正在识别人像边缘", "busy", 86);
          const image = await RawImage.fromURL(sourceUrl);
          const { pixel_values } = await processor(image);
          const { output } = await model({ input: pixel_values });
          const mask = (await RawImage.fromTensor(output[0].mul(255).to("uint8")).resize(image.width, image.height)).data;

          cutoutCanvas = document.createElement("canvas");
          cutoutCanvas.width = image.width;
          cutoutCanvas.height = image.height;
          const cutoutContext = cutoutCanvas.getContext("2d", { willReadFrequently: true });
          cutoutContext.drawImage(image.toCanvas(), 0, 0);
          const pixels = cutoutContext.getImageData(0, 0, image.width, image.height);

          // ponytail: one global spill color; use local edge sampling if mixed backgrounds matter.
          const oldBackground = [0, 0, 0];
          let samples = 0;
          const sampleStep = Math.max(1, Math.floor(mask.length / 20000));
          for (let i = 0; i < mask.length; i += sampleStep) {
            if (mask[i] > 8) continue;
            const offset = i * 4;
            oldBackground[0] += pixels.data[offset];
            oldBackground[1] += pixels.data[offset + 1];
            oldBackground[2] += pixels.data[offset + 2];
            samples++;
          }
          if (samples) oldBackground.forEach((value, index) => oldBackground[index] = value / samples);

          const spillChannel = oldBackground.indexOf(Math.max(...oldBackground));
          const cleanChannels = [0, 1, 2].filter((channel) => channel !== spillChannel);
          const backdropExcess = oldBackground[spillChannel] - Math.max(
            oldBackground[cleanChannels[0]],
            oldBackground[cleanChannels[1]],
          );
          const hasColoredBackground = backdropExcess > 24;
          const edgeRadius = Math.max(2, Math.round(Math.max(image.width, image.height) / 300));

          for (let i = 0; i < mask.length; i++) {
            const alpha = mask[i] / 255;
            const offset = i * 4;
            const x = i % image.width;
            const y = Math.floor(i / image.width);
            const nearEdge = alpha < .995
              || (x >= edgeRadius && mask[i - edgeRadius] < 250)
              || (x + edgeRadius < image.width && mask[i + edgeRadius] < 250)
              || (y >= edgeRadius && mask[i - image.width * edgeRadius] < 250)
              || (y + edgeRadius < image.height && mask[i + image.width * edgeRadius] < 250);

            if (samples && alpha > .08 && alpha < 1) {
              pixels.data[offset] = unmixChannel(pixels.data[offset], oldBackground[0], alpha);
              pixels.data[offset + 1] = unmixChannel(pixels.data[offset + 1], oldBackground[1], alpha);
              pixels.data[offset + 2] = unmixChannel(pixels.data[offset + 2], oldBackground[2], alpha);
            }
            if (hasColoredBackground && nearEdge) {
              pixels.data[offset + spillChannel] = suppressSpill(
                pixels.data[offset + spillChannel],
                pixels.data[offset + cleanChannels[0]],
                pixels.data[offset + cleanChannels[1]],
              );
            }
            pixels.data[offset + 3] = mask[i] < 6 ? 0 : mask[i];
          }
          cutoutContext.putImageData(pixels, 0, 0);

          render();
          downloadButton.disabled = false;
          setStatus("处理完成 · 可调整底色与构图", "", 100);
        } catch (error) {
          console.error(error);
          setStatus(navigator.onLine ? "处理失败，请换一张照片后重试" : "模型未缓存完成，请联网后重试", "error");
        } finally {
          processing = false;
        }
      };

      fileInput.addEventListener("change", () => fileInput.files[0] && processFile(fileInput.files[0]));

      [dropZone, uploadLabel].forEach((target) => {
        target.addEventListener("dragover", (event) => { event.preventDefault(); uploadLabel.classList.add("dragging"); });
        target.addEventListener("dragleave", () => uploadLabel.classList.remove("dragging"));
        target.addEventListener("drop", (event) => {
          event.preventDefault();
          uploadLabel.classList.remove("dragging");
          if (event.dataTransfer.files[0]) processFile(event.dataTransfer.files[0]);
        });
      });

      document.querySelectorAll(".swatch").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".swatch").forEach((item) => item.setAttribute("aria-pressed", "false"));
          button.setAttribute("aria-pressed", "true");
          background = button.dataset.color;
          render();
        });
      });

      $("#colorInput").addEventListener("input", (event) => {
        document.querySelectorAll(".swatch").forEach((item) => item.setAttribute("aria-pressed", "false"));
        background = event.target.value;
        render();
      });

      sizeSelect.addEventListener("change", render);
      zoomInput.addEventListener("input", () => { $("#zoomOutput").textContent = `${zoomInput.value}%`; render(); });
      positionInput.addEventListener("input", () => {
        const value = Number(positionInput.value);
        $("#positionOutput").textContent = value === 0 ? "居中" : `${value > 0 ? "下移" : "上移"} ${Math.abs(value)}%`;
        render();
      });
      horizontalInput.addEventListener("input", () => {
        const value = Number(horizontalInput.value);
        $("#horizontalOutput").textContent = value === 0 ? "居中" : `${value > 0 ? "右移" : "左移"} ${Math.abs(value)}%`;
        render();
      });
      adjustments.forEach(({ input, output }) => input.addEventListener("input", () => {
        const value = Number(input.value);
        output.textContent = `${value > 0 ? "+" : ""}${value}%`;
        render();
      }));

      downloadButton.addEventListener("click", () => {
        preview.toBlob((blob) => {
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `证件照-${sizeSelect.options[sizeSelect.selectedIndex].text.split(" · ")[0]}.jpg`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }, "image/jpeg", .96);
      });

      $("#resetButton").addEventListener("click", () => {
        if (sourceUrl) URL.revokeObjectURL(sourceUrl);
        sourceUrl = undefined;
        sourceCanvas = undefined;
        cutoutCanvas = undefined;
        fileInput.value = "";
        zoomInput.value = 100;
        positionInput.value = 0;
        horizontalInput.value = 0;
        $("#zoomOutput").textContent = "100%";
        $("#positionOutput").textContent = "居中";
        $("#horizontalOutput").textContent = "居中";
        adjustments.forEach(({ input, output }) => { input.value = 0; output.textContent = "0%"; });
        preview.style.display = "none";
        $("#emptyState").hidden = false;
        downloadButton.disabled = true;
        setStatus("等待上传照片");
      });

      webGpuAvailable.then((available) => {
        if (!available) $("#engineStamp").innerHTML = "WASM<br>READY";
      });
      render();
    </script>
  </body>
</html>
